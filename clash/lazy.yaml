    type: select
    use: ["机场订阅", "机场订阅 1"]
    filter: "(?i)(韩|KR|韩国|🇰🇷)"
  - name: "_SUB 🇬🇧 UK"
    type: select
    use: ["机场订阅", "机场订阅 1"]
    filter: "(?i)(英|伦敦|UK|🇬🇧)"
  - name: "_SUB 🇩🇪 DE"
    type: select
    use: ["机场订阅", "机场订阅 1"]
    filter: "(?i)(德|DE|德国|🇩🇪)"
  - name: "_SUB 🇹🇼 TW"
    type: select
    use: ["机场订阅", "机场订阅 1"]
    filter: "(?i)(台|TW|台湾)"
  - name: "_SUB 🇹🇷 TR"
    type: select
    use: ["机场订阅", "机场订阅 1"]
    filter: "(?i)(土|土耳其|TR|🇹🇷)"
  - name: "_SUB 🇦🇷 AR"
    type: select
    use: ["机场订阅", "机场订阅 1"]
    filter: "(?i)(阿|阿根廷|AR|🇦🇷)"
  - name: "_SUB 🇷🇺 RU"
