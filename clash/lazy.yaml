    proxies: [Proxy, UK, DE, SG, JP, US, KR, HK, TW, TR, AR, RU, CA]
  - name: Telegram
    type: select
    proxies: [US, SG, Proxy, HK]
  - name: Line
    type: select
    proxies: [DIRECT, Proxy, UK, DE, SG, JP, US, KR, HK, TW, TR, AR, RU, CA]
