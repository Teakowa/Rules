    proxies: [DIRECT, HK, TW, JP]
  - name: Pornhub
    type: select
    proxies: [GlobalTV, UK, DE, SG, JP, US, KR, HK, TW, TR, AR, RU, CA, DIRECT]
  - name: "Social Platform"
