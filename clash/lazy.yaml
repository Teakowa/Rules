# ════════════════════════════════════════════════════════════════
#  Teakowa Rules · Clash 懒人配置（自动生成，请勿手动修改）
#  由 templates/egern-lazy.yaml 模板派生，更新模板后自动重建
# ════════════════════════════════════════════════════════════════

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true

dns:
  enable: true
  ipv6: true
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://8.8.8.8/dns-query
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

# ── 订阅（替换 url 为你的机场链接）─────────────────────────────
proxy-providers:
  机场订阅:
    type: http
    url: "https://your-subscribe-url/sub"
    interval: 86400
    path: ./providers/airport-1.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
  机场订阅 1:
    type: http
    url: "https://your-subscribe-url/sub"
    interval: 86400
    path: ./providers/airport-2.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

# ── 代理组 ──────────────────────────────────────────────────────
proxy-groups:
  - name: Proxy
    type: select
    proxies: [UK, DE, SG, JP, US, KR, HK, TW, TR, AR, RU, CA, DIRECT]
  - name: Others
    type: select
    proxies: [Proxy, DIRECT, UK, DE, SG, JP, US, KR, HK, TW, TR, AR, RU, CA]
  - name: AdBlock
    type: select
    proxies: [REJECT, DIRECT]
  - name: Apple
    type: select
    proxies: [DIRECT, Proxy, UK, DE, SG, JP, US, KR, HK, TW, TR, AR, RU, CA]
  - name: " Apple CDN"
    type: select
    proxies: [Apple, DIRECT, Proxy, UK, DE, SG, JP, US, KR, HK, TW, TR, AR, RU, CA]
  - name: AppleNews
    type: select
    proxies: [" Apple CDN", Proxy, DIRECT]
  - name: GlobalTV
    type: select
    proxies: [Proxy, UK, DE, SG, JP, US, KR, HK, TW, TR, AR, RU, CA, DIRECT]
  - name: Google
    type: select
    proxies: [Proxy, SG, HK, JP, US, KR, CA, RU, AR, TR, TW, DE, UK, DIRECT]
  - name: YouTube
    type: select
    proxies: [GlobalTV, DIRECT, UK, DE, SG, JP, US, KR, HK, TW, TR, AR, RU, CA]
  - name: Spotify
    type: select
    proxies: [GlobalTV, DIRECT, UK, DE, SG, JP, US, KR, HK, TW, TR, AR, RU, CA]
  - name: Netflix
