    interval: 300
    proxies: ["_SUB 🇷🇺 RU"]
  - name: CA
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies: ["_SUB 🇨🇦 CA"]
  - name: "_SUB 🇭🇰 HK"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    use: ["机场订阅", "机场订阅 1"]
    filter: "(?i)(港|HK|Hong|🇭🇰)"
  - name: "_SUB 🇸🇬 SG"
    type: select
    use: ["机场订阅", "机场订阅 1"]
    filter: "(?i)(新加坡|SG|🇸🇬)"
  - name: "_SUB 🇯🇵 JP"
    type: select
    use: ["机场订阅", "机场订阅 1"]
    filter: "(?i)(日本|JP|Japan|🇯🇵)"
  - name: "_SUB 🇺🇸 US"
    type: select
    use: ["机场订阅", "机场订阅 1"]
    filter: "(?i)(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|🇺🇸)"
