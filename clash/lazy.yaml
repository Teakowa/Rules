    proxies: [DIRECT, UK, DE, SG, JP, US, KR, HK, TW, TR, AR, RU, CA]
  - name: Web3
    type: select
    proxies: [DIRECT, Proxy, UK, DE, SG, JP, US, KR, HK, TW, TR, AR, RU, CA]
  - name: HK
    type: select
    proxies: ["_SUB 🇭🇰 HK"]
  - name: SG
    type: select
    proxies: ["_SUB 🇸🇬 SG"]
  - name: JP
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies: ["_SUB 🇯🇵 JP"]
  - name: US
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies: ["_SUB 🇺🇸 US"]
  - name: KR
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies: ["_SUB 🇰🇷 KR"]
  - name: UK
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies: ["_SUB 🇬🇧 UK"]
  - name: DE
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies: ["_SUB 🇩🇪 DE"]
  - name: TW
